<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>범용 가챠 시뮬레이터 Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>body{background:#070a12;color:#f1f5f9;font-family:Pretendard,sans-serif} input[type=number]{color-scheme:dark}</style>
</head>
<body class="min-h-screen p-4">
  <main class="max-w-5xl mx-auto space-y-4">
    <header class="flex flex-wrap justify-between items-center gap-3 border-b border-gray-800 pb-4">
      <div><h1 class="text-2xl font-black text-amber-300">GACHA SIMULATOR PRO</h1><p class="text-sm text-gray-400">최고등급 다중 지정 · 등급 순서 변경 · 캐릭터 프리셋</p></div>
      <div class="flex gap-2"><button onclick="doPull(1)" class="rounded-xl bg-gray-800 px-4 py-2 font-bold">1회 소환</button><button onclick="doPull(10)" class="rounded-xl bg-purple-600 px-4 py-2 font-bold">10회 소환</button></div>
    </header>
    <section class="grid md:grid-cols-3 gap-3">
      <div class="rounded-2xl border border-gray-800 bg-gray-950 p-4"><h2 class="font-bold">소환 통계</h2><p class="mt-3 text-gray-300">누적 소환: <b id="total">0</b>회</p><p class="text-gray-300">획득 아이템 종류: <b id="owned">0</b></p><button class="mt-3 text-rose-300 underline" onclick="resetStats()">통계 초기화</button></div>
      <div class="md:col-span-2 rounded-2xl border border-gray-800 bg-gray-950 p-4"><h2 class="font-bold mb-2">최근 결과</h2><div id="results" class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-sm text-gray-300">소환 결과가 여기에 표시됩니다.</div></div>
    </section>
    <section class="rounded-2xl border border-gray-800 bg-gray-950 p-4 space-y-3">
      <div class="flex flex-wrap justify-between items-center gap-2"><div><h2 class="font-bold text-lg">등급 및 캐릭터 편집</h2><p class="text-xs text-gray-400">👑 최고등급을 여러 개 선택할 수 있으며, ▲/▼로 등급 순서를 조정합니다.</p></div><button onclick="addRarity()" class="rounded-lg bg-purple-600 px-3 py-2 text-sm font-bold">+ 등급 추가</button></div>
      <p class="text-sm">확정 천장: <input id="pity" type="number" min="1" value="80" class="w-20 rounded bg-gray-900 p-1" onchange="save()"> 회</p>
      <div id="rarities" class="space-y-3"></div>
    </section>
    <section class="rounded-2xl border border-purple-500/30 bg-gray-950 p-4 space-y-3">
      <h2 class="font-bold text-lg">캐릭터 프리셋</h2><p class="text-xs text-gray-400">프리셋 저장 시 등급/확률/최고등급 설정과 캐릭터 이름 및 이미지 주소를 함께 보관합니다.</p>
      <div class="flex flex-wrap gap-2"><input id="presetName" class="min-w-48 flex-1 rounded-lg border border-gray-700 bg-gray-900 px-3 py-2 text-sm" placeholder="프리셋 이름"><button onclick="savePreset()" class="rounded-lg bg-purple-600 px-3 py-2 text-sm font-bold">현재 설정 저장</button></div>
      <div class="flex flex-wrap gap-2"><select id="presets" class="min-w-48 flex-1 rounded-lg border border-gray-700 bg-gray-900 px-3 py-2 text-sm" onchange="showPresetInfo()"><option value="">저장된 프리셋 선택...</option></select><button onclick="applyPreset()" class="rounded-lg bg-emerald-700 px-3 py-2 text-sm font-bold">적용</button><button onclick="deletePreset()" class="rounded-lg bg-rose-900 px-3 py-2 text-sm font-bold">삭제</button></div><p id="presetInfo" class="text-xs text-gray-400"></p>
    </section>
    <p id="message" class="min-h-5 text-sm text-emerald-300"></p>
  </main>
<script>
'use strict';
const STATE_KEY='gacha_master_state_v5', PRESET_KEY='gacha_user_custom_presets_v5';
const defaults={pity:{target:80,count:0},stats:{total:0,itemCounts:{}},rarities:[
 {id:'ssr',name:'SSR',rate:1,color:'#f59e0b',isTopTier:true,items:[{id:'a',name:'빛의 성녀 루시아',img:'',isFeatured:true},{id:'b',name:'칠흑의 기사 바알',img:'',isFeatured:false}]},
 {id:'sr',name:'SR',rate:9,color:'#a855f7',isTopTier:false,items:[{id:'c',name:'미스릴 레이피어',img:'',isFeatured:false}]},
 {id:'r',name:'R',rate:90,color:'#3b82f6',isTopTier:false,items:[{id:'d',name:'용병의 녹슨 칼',img:'',isFeatured:false}]}
]};
function clone(x){return JSON.parse(JSON.stringify(x));}
function read(key,fallback){try{const x=JSON.parse(localStorage.getItem(key));return x&&typeof x==='object'?x:clone(fallback)}catch(_){return clone(fallback)}}
let state=read(STATE_KEY,defaults), presets=read(PRESET_KEY,{});
function normalize(){
 if(!Array.isArray(state.rarities)||!state.rarities.length)state.rarities=clone(defaults.rarities);
 state.rarities.forEach((r,i)=>{r.id=r.id||`rarity_${Date.now()}_${i}`;r.name=String(r.name||`등급 ${i+1}`);r.rate=Math.max(0,Number(r.rate)||0);r.color=r.color||'#64748b';r.isTopTier=!!r.isTopTier;if(!Array.isArray(r.items))r.items=[];r.items.forEach((it,j)=>{it.id=it.id||`${r.id}_item_${j}`;it.name=String(it.name||'이름 없는 아이템');it.img=String(it.img||'');it.isFeatured=!!it.isFeatured})});
 if(!state.rarities.some(r=>r.isTopTier))state.rarities[0].isTopTier=true;
 state.pity=state.pity||{target:80,count:0};state.pity.target=Math.max(1,parseInt(state.pity.target)||80);state.pity.count=Math.max(0,parseInt(state.pity.count)||0);
 state.stats=state.stats||{total:0,itemCounts:{}};state.stats.total=Math.max(0,parseInt(state.stats.total)||0);state.stats.itemCounts=state.stats.itemCounts||{};
}
function save(){normalize();try{localStorage.setItem(STATE_KEY,JSON.stringify(state))}catch(e){say('저장 공간이 부족해 저장하지 못했습니다.')}render();}
function say(t){document.getElementById('message').textContent=t;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 document.getElementById('pity').value=state.pity.target;
 document.getElementById('total').textContent=state.stats.total.toLocaleString();document.getElementById('owned').textContent=Object.keys(state.stats.itemCounts).length;
 const root=document.getElementById('rarities');root.innerHTML='';
 state.rarities.forEach((r,i)=>{const card=document.createElement('article');card.className='rounded-xl border '+(r.isTopTier?'border-amber-500/70':'border-gray-800')+' bg-gray-900/70 p-3 space-y-2';
 let items=r.items.map((it,j)=>`<div class="grid grid-cols-1 sm:grid-cols-[1fr_1.4fr_auto] gap-2 rounded-lg bg-gray-950 p-2"><input aria-label="아이템 이름" value="${esc(it.name)}" placeholder="캐릭터/아이템 이름" class="min-w-0 rounded bg-gray-900 px-2 py-1" onchange="editItem(${i},${j},'name',this.value)"><input aria-label="이미지 URL" value="${esc(it.img)}" placeholder="이미지 URL (선택)" class="min-w-0 rounded bg-gray-900 px-2 py-1 text-xs" onchange="editItem(${i},${j},'img',this.value)"><button class="text-rose-300" onclick="removeItem(${i},${j})">삭제</button></div>`).join('');
 card.innerHTML=`<div class="flex flex-wrap items-center gap-2"><div class="flex gap-1"><button onclick="moveRarity(${i},-1)" ${i===0?'disabled':''} class="rounded bg-gray-800 px-2 py-1 disabled:opacity-30" aria-label="위로 이동">▲</button><button onclick="moveRarity(${i},1)" ${i===state.rarities.length-1?'disabled':''} class="rounded bg-gray-800 px-2 py-1 disabled:opacity-30" aria-label="아래로 이동">▼</button></div><input value="${esc(r.name)}" aria-label="등급 이름" class="w-24 rounded bg-gray-950 px-2 py-1 font-bold" onchange="editRarity(${i},'name',this.value)"><label class="flex cursor-pointer items-center gap-1 rounded px-2 py-1 text-xs ${r.isTopTier?'bg-amber-400 text-black':'bg-gray-800 text-gray-300'}"><input type="checkbox" ${r.isTopTier?'checked':''} onchange="setTop(${i},this.checked)">👑 최고등급</label><label class="ml-auto flex items-center gap-1 text-xs text-gray-400">확률 <input type="number" min="0" max="100" step="0.01" value="${r.rate}" class="w-20 rounded bg-gray-950 px-2 py-1 text-right text-amber-300" onchange="editRarity(${i},'rate',this.value)">%</label><input type="color" value="${esc(r.color)}" aria-label="등급 색상" onchange="editRarity(${i},'color',this.value)"><button onclick="removeRarity(${i})" class="rounded bg-rose-950 px-2 py-1 text-xs text-rose-200">등급 삭제</button></div><div class="space-y-1">${items||'<p class="text-xs text-gray-500">등록된 캐릭터/아이템이 없습니다.</p>'}</div><button onclick="addItem(${i})" class="rounded bg-gray-800 px-2 py-1 text-xs text-purple-200">+ 캐릭터/아이템 추가</button>`;root.appendChild(card);
 });
 const total=state.rarities.reduce((n,r)=>n+r.rate,0);say(`등급 확률 합계: ${total.toFixed(2)}%${Math.abs(total-100)>.01?' (권장 합계 100%)':''}`);
}
function editRarity(i,k,v){if(!state.rarities[i])return;state.rarities[i][k]=k==='rate'?Math.max(0,Number(v)||0):v;save()}
function setTop(i,on){if(!state.rarities[i])return;if(!on&&!state.rarities.some((r,j)=>j!==i&&r.isTopTier)){say('최고등급은 최소 하나 지정해야 합니다.');render();return}state.rarities[i].isTopTier=on;save()}
function moveRarity(i,d){const j=i+d;if(j<0||j>=state.rarities.length)return;[state.rarities[i],state.rarities[j]]=[state.rarities[j],state.rarities[i]];save()}
function addRarity(){state.rarities.push({id:`rarity_${Date.now()}`,name:'새 등급',rate:0,color:'#10b981',isTopTier:false,items:[]});save()}
function removeRarity(i){if(state.rarities.length<=1)return say('등급은 하나 이상 필요합니다.');if(!confirm(`${state.rarities[i].name} 등급을 삭제할까요?`))return;state.rarities.splice(i,1);if(!state.rarities.some(r=>r.isTopTier))state.rarities[0].isTopTier=true;save()}
function addItem(i){state.rarities[i].items.push({id:`item_${Date.now()}`,name:'새 캐릭터/아이템',img:'',isFeatured:false});save()}
function editItem(i,j,k,v){const it=state.rarities[i]?.items[j];if(it){it[k]=v;save()}}
function removeItem(i,j){state.rarities[i].items.splice(j,1);save()}
function weighted(list){const valid=list.filter(x=>x.rate>0);if(!valid.length)return list[0];let n=Math.random()*valid.reduce((s,x)=>s+x.rate,0);for(const x of valid){n-=x.rate;if(n<0)return x}return valid[valid.length-1]}
function doPull(count){normalize();const top=state.rarities.filter(r=>r.isTopTier);if(!top.length)return say('최고등급을 하나 이상 지정하세요.');const topRate=top.reduce((s,r)=>s+r.rate,0);const other=state.rarities.filter(r=>!r.isTopTier);let out=[];
 for(let k=0;k<count;k++){state.pity.count++;let rarity;if(state.pity.count>=state.pity.target){rarity=weighted(top);state.pity.count=0}else if(Math.random()*100<topRate){rarity=weighted(top)}else{rarity=weighted(other.length?other:top)}const list=rarity.items;const item=list.length?list[Math.floor(Math.random()*list.length)]:{name:rarity.name+' 아이템',img:''};state.stats.itemCounts[item.name]=(state.stats.itemCounts[item.name]||0)+1;state.stats.total++;out.push({rarity,item});}
 save();document.getElementById('results').innerHTML=out.map(x=>`<div class="rounded-lg border border-gray-700 bg-gray-900 p-2" style="border-color:${esc(x.rarity.color)}"><b style="color:${esc(x.rarity.color)}">${esc(x.rarity.name)}</b><div>${esc(x.item.name)}</div></div>`).join('');}
function resetStats(){if(!confirm('통계를 초기화할까요?'))return;state.stats={total:0,itemCounts:{}};save();}
function getPresets(){presets=read(PRESET_KEY,{});return presets}
function renderPresets(){const sel=document.getElementById('presets'),old=sel.value;const data=getPresets();sel.innerHTML='<option value="">저장된 프리셋 선택...</option>';Object.keys(data).sort((a,b)=>a.localeCompare(b,'ko')).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o)});if(data[old])sel.value=old;showPresetInfo()}
function savePreset(){const name=document.getElementById('presetName').value.trim();if(!name)return say('프리셋 이름을 입력하세요.');const data=getPresets();data[name]={rarities:clone(state.rarities),pity:{target:state.pity.target}};try{localStorage.setItem(PRESET_KEY,JSON.stringify(data));document.getElementById('presetName').value='';renderPresets();document.getElementById('presets').value=name;say(`'${name}' 프리셋을 저장했습니다.`)}catch(e){say('프리셋 저장에 실패했습니다. 브라우저 저장 공간을 확인하세요.')}}
function showPresetInfo(){const p=getPresets()[document.getElementById('presets').value];document.getElementById('presetInfo').textContent=p?`${p.rarities.length}개 등급 · ${p.rarities.reduce((n,r)=>n+(r.items||[]).length,0)}개 캐릭터/아이템 · 최고등급 ${p.rarities.filter(r=>r.isTopTier).map(r=>r.name).join(', ')}`:''}
function applyPreset(){const name=document.getElementById('presets').value,p=getPresets()[name];if(!p)return say('적용할 프리셋을 선택하세요.');if(!Array.isArray(p.rarities)||!p.rarities.length)return say('프리셋 데이터가 올바르지 않습니다.');state.rarities=clone(p.rarities);state.pity={...state.pity,...clone(p.pity||{})};normalize();save();say(`'${name}' 프리셋을 적용했습니다.`)}
function deletePreset(){const name=document.getElementById('presets').value;if(!name)return say('삭제할 프리셋을 선택하세요.');if(!confirm(`'${name}' 프리셋을 삭제할까요?`))return;const data=getPresets();delete data[name];localStorage.setItem(PRESET_KEY,JSON.stringify(data));renderPresets();say(`'${name}' 프리셋을 삭제했습니다.`)}
document.getElementById('pity').addEventListener('change',e=>{state.pity.target=Math.max(1,parseInt(e.target.value)||80);save()});
normalize();render();renderPresets();
</script>
</body>
</html>
